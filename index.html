<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFC61A">
<title>라틴소울 수업 신청</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --y:#FFC61A; --y-d:#E0A800; --y-l:#FFF6DC; --y-l2:#FFEFC0;
  --ink:#191919; --ink-2:#2E2A22;
  --bg:#FFFDF6; --surface:#FFFFFF; --line:#EDE2C6; --line2:#DCC99C;
  --txt:#191919; --sub:#5E5646; --dim:#6F6656;
  --ok:#0E6B3E; --okbg:#E7F4EC; --bad:#B02318; --badbg:#FDEDEA;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Pretendard Variable",Pretendard,system-ui,-apple-system,sans-serif;}
html{-webkit-text-size-adjust:100%;}
body{background:var(--bg);color:var(--txt);line-height:1.55;font-size:16px;}
button{font:inherit;cursor:pointer;border:none;background:none;}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:4px;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

/* ── 헤더 : 흰 바탕에 엠블럼, 그 아래 노랑 띠 ── */
.top{background:var(--surface);padding:16px 16px 0;text-align:center;}
#logo{display:inline-block;line-height:0;}
#logo svg,#logo img{width:102px;height:auto;display:block;}
.band{background:var(--y);border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);
  padding:11px 16px;text-align:center;margin-top:12px;}
.band h1{font-size:17px;font-weight:900;color:var(--ink);letter-spacing:-.01em;}
.band .sub{font-size:12.5px;font-weight:700;color:var(--ink-2);margin-top:2px;opacity:.85;}
.badge{display:inline-block;margin-top:7px;font-size:11.5px;font-weight:900;padding:3px 11px;
  border-radius:20px;background:var(--ink);color:var(--y);letter-spacing:.02em;}
.badge.off{background:rgba(25,25,25,.16);color:var(--ink);}

.wrap{max-width:600px;margin:0 auto;padding:16px 16px 132px;}
.privacy-top{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;
  padding:11px 13px;font-size:12.5px;color:var(--sub);display:flex;gap:9px;align-items:flex-start;}

.tabs{display:flex;gap:6px;margin:14px 0 16px;background:var(--surface);
  border:1.5px solid var(--line);border-radius:12px;padding:5px;}
.tabs button{flex:1;padding:11px;border-radius:9px;color:var(--sub);font-size:15px;font-weight:800;}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff;}
.tabs button:disabled{opacity:.38;cursor:not-allowed;}

/* 로고의 'SOUL' 밑줄 무늬에서 가져온 형광펜 강조 */
h2.sec{font-size:16px;font-weight:900;margin:26px 0 4px;display:flex;align-items:center;gap:9px;}
h2.sec .n{display:inline-flex;align-items:center;justify-content:center;width:23px;height:23px;
  border-radius:50%;background:var(--y);color:var(--ink);font-size:12px;font-weight:900;
  flex:0 0 auto;border:2px solid var(--ink);}
h2.sec .t{background:linear-gradient(to top,var(--y) 0 34%,transparent 34%);padding:0 2px;}
h2.sec:first-of-type{margin-top:4px;}
.hint{font-size:13px;color:var(--sub);margin:3px 0 10px;}

.ttbox{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);margin:2px 0 12px;}
.ttscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tt{width:100%;border-collapse:collapse;font-size:12.5px;}
.tt th,.tt td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);
  padding:8px 6px;text-align:center;vertical-align:middle;}
.tt tr:last-child th,.tt tr:last-child td{border-bottom:none;}
.tt th:last-child,.tt td:last-child{border-right:none;}
.tt thead th{background:var(--ink);color:var(--y);font-weight:900;font-size:12px;}
.tt th.tm{background:var(--y-l);font-weight:800;white-space:nowrap;font-size:11.5px;color:var(--ink);}
.tt .cell{display:block;font-weight:700;line-height:1.35;padding:1px 0;}
.tt .who{display:block;font-weight:600;font-size:11px;color:var(--sub);line-height:1.3;margin-top:1px;}
.tt .none{color:var(--dim);}
.ttcap{font-size:12px;color:var(--sub);text-align:center;padding:7px 6px;background:var(--y-l);
  font-weight:700;}.slot{margin-bottom:12px;}
.slot .st{display:inline-block;font-size:11.5px;font-weight:900;color:var(--ink);
  background:var(--y);padding:2px 9px;border-radius:5px;margin:0 0 7px 1px;letter-spacing:.02em;}
.opt{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--line);
  border-radius:12px;padding:13px 14px;margin-bottom:7px;cursor:pointer;transition:.12s;}
.opt:hover{border-color:var(--line2);}
.opt input{width:20px;height:20px;accent-color:var(--ink);flex:0 0 auto;cursor:pointer;}
.opt .body{flex:1;min-width:0;}
.opt .nm{font-size:15px;font-weight:700;display:block;}
.opt .meta{font-size:12.5px;color:var(--sub);display:block;margin-top:1px;}
.opt .fee{font-size:15px;font-weight:800;white-space:nowrap;}
.opt.on{border-color:var(--ink);background:var(--y-l);}
.opt.off{opacity:.42;cursor:not-allowed;}
.opt.off input{cursor:not-allowed;}
.perbox{border:1.5px solid var(--line);border-radius:12px;padding:11px 12px 4px;margin-bottom:7px;background:var(--surface);}
.pertit{font-size:15px;font-weight:800;margin-bottom:2px;}
.permeta{font-size:12.5px;color:var(--sub);margin-bottom:8px;}
.opt.sm{padding:9px 11px;margin-bottom:7px;}
.opt.sm .nm{font-size:14px;font-weight:700;}
.opt.sm .fee{font-size:14px;color:var(--ok);}
.tag{display:inline-block;font-size:10.5px;font-weight:900;padding:2px 7px;border-radius:5px;
  margin-left:6px;vertical-align:1px;background:var(--y-l2);color:var(--ink-2);}
.tag.full{background:var(--badbg);color:var(--bad);}
.tag.left{background:var(--okbg);color:var(--ok);}

label.f{display:block;font-size:14px;font-weight:800;margin:14px 0 5px;}
label.f .req{color:var(--bad);margin-left:2px;}
label.f .why{display:block;font-size:12px;font-weight:500;color:var(--sub);margin-top:2px;}
input[type=text],input[type=tel],textarea{width:100%;padding:13px 14px;border-radius:10px;
  border:1.5px solid var(--line);background:var(--surface);color:var(--txt);font-size:16px;}
input:focus,textarea:focus{border-color:var(--ink);}
input.bad,textarea.bad{border-color:var(--bad);background:#FFF8F7;}
input::placeholder,textarea::placeholder{color:var(--dim);}
textarea{min-height:74px;resize:vertical;}
.sub{font-size:12.5px;color:var(--sub);margin-top:5px;}
.fieldErr{font-size:12.5px;color:var(--bad);font-weight:800;margin-top:5px;}
.genders{display:flex;gap:8px;}
.genders label{flex:1;text-align:center;padding:12px;border-radius:10px;background:var(--surface);
  border:1.5px solid var(--line);font-size:15px;font-weight:800;cursor:pointer;}
.genders input{position:absolute;opacity:0;width:0;height:0;}
.genders label:has(input:checked){border-color:var(--ink);background:var(--y-l);}

.box{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:15px;margin-top:10px;}
.line{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--sub);margin:6px 0;}
.line b{color:var(--txt);font-weight:700;}
.line.disc b{color:var(--ok);}
.hr{height:1px;background:var(--line);margin:12px 0;}
.total{display:flex;justify-content:space-between;align-items:baseline;
  background:var(--y);border-radius:10px;padding:11px 13px;margin:0 -2px;}
.total .l{font-size:15px;font-weight:900;color:var(--ink);}
.total .v{font-size:26px;font-weight:900;color:var(--ink);}
.note{font-size:12.5px;background:var(--y-l);border:1px solid var(--line2);color:var(--ink-2);
  border-radius:9px;padding:9px 11px;margin-top:9px;}
.err{font-size:13.5px;color:var(--bad);background:var(--badbg);border-radius:9px;
  padding:10px 12px;margin-top:10px;font-weight:700;}

.agree{display:flex;gap:11px;align-items:flex-start;background:var(--surface);
  border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-top:9px;cursor:pointer;}
.agree.on{border-color:var(--ink);background:var(--y-l);}
.agree input{margin-top:2px;width:20px;height:20px;accent-color:var(--ink);flex:0 0 auto;}
details{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px;}
summary{cursor:pointer;font-size:13px;color:var(--sub);font-weight:800;}
details pre{margin-top:9px;font-size:12.5px;color:var(--sub);white-space:pre-wrap;
  line-height:1.65;font-family:inherit;}

.btn{display:block;width:100%;padding:15px;border-radius:12px;font-size:16px;font-weight:900;
  background:var(--ink);color:#fff;margin-top:16px;}
.btn:hover:not(:disabled){background:#000;}
.btn:disabled{opacity:.42;cursor:not-allowed;}
.btn.ghost{background:var(--surface);color:var(--sub);border:1.5px solid var(--line);}
.btn.danger{background:var(--surface);color:var(--bad);border:1.5px solid #EFC6C1;}
.btnrow{display:flex;gap:9px;}
.btnrow .btn{margin-top:0;}

.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);
  border-top:3px solid var(--ink);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:20;}
.dock .in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:12px;}
.dock .info{flex:1;min-width:0;}
.dock .cnt{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dock .amt{font-size:21px;font-weight:900;color:var(--ink);line-height:1.2;
  background:linear-gradient(to top,var(--y) 0 30%,transparent 30%);display:inline;}
.dock .go{padding:14px 22px;border-radius:11px;background:var(--ink);color:#fff;
  font-size:15px;font-weight:900;white-space:nowrap;}
.dock .go:disabled{opacity:.42;}

.center{text-align:center;padding:44px 20px;}
.center h2{font-size:19px;font-weight:900;margin-bottom:9px;}
.center p{color:var(--sub);font-size:14.5px;}
.spin{width:40px;height:40px;margin:0 auto 16px;border:4px solid var(--line);
  border-top-color:var(--y-d);border-radius:50%;animation:sp 1s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}

.done{text-align:center;}
.done .ok{width:58px;height:58px;margin:6px auto 12px;border-radius:50%;background:var(--y);
  border:3px solid var(--ink);color:var(--ink);font-size:29px;line-height:52px;font-weight:900;}
.done .no{font-size:27px;font-weight:900;color:var(--ink);letter-spacing:.05em;margin:8px 0;
  display:inline-block;background:linear-gradient(to top,var(--y) 0 32%,transparent 32%);padding:0 6px;}
.copy{padding:9px 17px;border-radius:9px;background:var(--surface);color:var(--txt);
  border:1.5px solid var(--line2);font-size:13.5px;font-weight:800;}
.pay{text-align:left;background:var(--y-l);border:2px solid var(--ink);border-radius:12px;
  padding:14px;margin-top:14px;}
.pay .t{font-size:12.5px;color:var(--ink-2);font-weight:900;}
.pay .acc{font-size:19px;font-weight:900;color:var(--ink);margin:5px 0;word-break:break-all;}

.foot{max-width:600px;margin:0 auto;padding:0 16px 26px;font-size:12px;color:var(--dim);
  text-align:center;line-height:1.7;}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,14px);background:var(--ink);
  color:#fff;padding:12px 20px;border-radius:24px;font-size:14px;opacity:0;pointer-events:none;
  transition:.22s;z-index:60;max-width:88vw;text-align:center;font-weight:700;}
.toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>

<header class="top">
  <div id="logo" role="img" aria-label="라틴소울 홍대"></div>
</header>
<div class="band">
  <h1 id="hTitle">수업 신청</h1>
  <div class="sub" id="hSub">불러오는 중…</div>
  <span class="badge" id="hBadge" hidden></span>
</div>

<main class="wrap" id="app" aria-live="polite">
  <div class="center"><div class="spin"></div><p>수업 정보를 불러오는 중입니다…</p></div>
</main>

<div class="foot" id="foot"></div>
<div id="dock"></div>
<div class="toast" id="toast" role="status"></div>

<script>
var API = "https://script.google.com/macros/s/AKfycbwzV2yVfWSePu8rFmvFERaPbVFBahPKybLgR1tCQyqkelLR_RcSvIPMG5w4btxIc7L2YQ/exec";
var CFG=null, SKEW=0;
var S={tab:'apply',picks:[],manual:{},proof:'',nickname:'',realname:'',phone:'',birth:'',
  gender:'',payer:'',payerTouched:false,agreed:false,busy:false,error:'',fieldErr:{},
  perClass:{},done:null,found:null,lookPhone:'',lookBirth:'',lookErr:'',editing:false};

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function won(n){return (n||0).toLocaleString('ko-KR')+'원';}
function str(v){return v==null?'':String(v).trim();}
function digits(v){return str(v).replace(/[^0-9]/g,'');}
function now(){return new Date(Date.now()+SKEW);}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2500);}
function fmtDate(iso){var d=new Date(iso);
  return d.getFullYear()+'.'+(d.getMonth()+1)+'.'+d.getDate()+' '+
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function hyphenPhone(v){var d=digits(v).slice(0,11);
  if(d.length<4)return d; if(d.length<8)return d.slice(0,3)+'-'+d.slice(3);
  return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7);}
function hyphenBirth(v){var d=digits(v).slice(0,8);
  if(d.length<5)return d; if(d.length<7)return d.slice(0,4)+'-'+d.slice(4);
  return d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6);}
function validBirth(v){var d=digits(v);
  if(!/^\d{8}$/.test(d))return false;
  var y=+d.slice(0,4),m=+d.slice(4,6),day=+d.slice(6),ny=new Date().getFullYear();
  if(y<1930||y>ny||m<1||m>12)return false;
  var dt=new Date(y,m-1,day);
  return dt.getFullYear()===y&&dt.getMonth()===m-1&&dt.getDate()===day;}

/* ── 로고 : logo.png 가 있으면 그것을, 없으면 아래 엠블럼을 그린다 ── */
function logoSVG(){
  var cx=60,cy=60,R=56,r=40,p=[];
  for(var i=0;i<32;i++){
    var a=Math.PI*2*i/32-Math.PI/2, rad=(i%2===0)?R:r;
    p.push((cx+rad*Math.cos(a)).toFixed(1)+','+(cy+rad*Math.sin(a)).toFixed(1));
  }
  var st=[];
  for(var j=0;j<=9;j++){
    var k=(j*4)%9, a2=Math.PI*2*k/9-Math.PI/2;
    st.push((cx+50*Math.cos(a2)).toFixed(1)+','+(cy+50*Math.sin(a2)).toFixed(1));
  }
  return '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+
    '<polygon points="'+p.join(' ')+'" fill="#FFC61A" stroke="#191919" stroke-width="2.6" stroke-linejoin="round"/>'+
    '<polyline points="'+st.join(' ')+'" fill="none" stroke="#191919" stroke-width="2.6" stroke-linejoin="round"/>'+
    '<circle cx="60" cy="58" r="30" fill="#FFC61A"/>'+
    '<text x="60" y="53" text-anchor="middle" font-family="Pretendard,sans-serif" font-size="15" font-weight="900" fill="#191919">LATIN</text>'+
    '<rect x="36" y="58" width="48" height="10" fill="#FFFFFF" opacity=".85"/>'+
    '<text x="60" y="68" text-anchor="middle" font-family="Pretendard,sans-serif" font-size="15" font-weight="900" fill="#191919">SOUL</text>'+
    '<rect x="26" y="97" width="68" height="17" rx="3" fill="#FFC61A" stroke="#191919" stroke-width="2.4"/>'+
    '<text x="60" y="109.5" text-anchor="middle" font-family="Pretendard,sans-serif" font-size="10" font-weight="900" fill="#191919" letter-spacing="1">HONGDAE</text>'+
    '</svg>';
}
function mountLogo(){
  var box=$('logo');
  box.innerHTML=logoSVG();
  var img=new Image();
  img.onload=function(){ img.alt=''; box.innerHTML=''; box.appendChild(img); };
  img.onerror=function(){};
  img.src='logo.png';
}

function loadConfig(){return new Promise(function(res,rej){
  var cb='ls_cb_'+Math.floor(Math.random()*1e9),s=document.createElement('script');
  var t=setTimeout(function(){try{delete window[cb];}catch(e){}s.remove();rej(new Error('시간이 초과되었습니다'));},20000);
  window[cb]=function(d){clearTimeout(t);try{delete window[cb];}catch(e){}s.remove();res(d);};
  s.onerror=function(){clearTimeout(t);s.remove();rej(new Error('연결하지 못했습니다'));};
  s.src=API+'?callback='+cb+'&t='+Date.now();document.body.appendChild(s);});}
function receipt(id){return new Promise(function(res){
  var cb='ls_rc_'+Math.floor(Math.random()*1e9),s=document.createElement('script');
  var t=setTimeout(function(){try{delete window[cb];}catch(e){}s.remove();res(null);},15000);
  window[cb]=function(d){clearTimeout(t);try{delete window[cb];}catch(e){}s.remove();res(d);};
  s.onerror=function(){clearTimeout(t);s.remove();res(null);};
  s.src=API+'?action=receipt&reqId='+encodeURIComponent(id)+'&callback='+cb+'&t='+Date.now();
  document.body.appendChild(s);});}
function post(p){return fetch(API,{method:'POST',mode:'cors',redirect:'follow',
  headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)})
  .then(function(r){return r.json();});}

/* ── 금액 계산 : 서버 calcQuote 와 같은 규칙 ── */
function overlaps(a,b){if(!a||!b)return false;if(a.day&&b.day&&a.day!==b.day)return false;
  if(a.start==null||b.start==null)return false;return a.start<b.end&&b.start<a.end;}
/* =================================================================
 * 금액 계산 v4 — 21차수 정책
 *
 * 1단계  과목별로 할인을 붙인다 (사전신청·재수강·수업후기·패키지·1+1)
 * 2단계  남은 금액에 비율 할인을 붙인다 (2030 30%)
 *
 * 할인 시트
 *   A ID | B 표시명 | C 방식 | D 값 | E 대상과목 | F 자격조건
 *   G 자동 | H 증빙 | I 중복불가 | J 안내문 | K 사용
 *
 *   · 대상과목 : 비우면 전 과목. 「베이직/기초반」처럼 클래스명만 쓰면 장르 무관.
 *                「살사/공연반」처럼 쓰면 그 과목만.
 *   · 자격조건 : 「출생연도:1991-2006」 형태. 생년월일로 자동 판정한다.
 *   · 중복불가 : 「재수강」 = 그 할인이 붙으면 이 할인 전체가 빠짐
 *                「재수강:과목」 = 그 할인이 붙은 과목에만 이 할인이 안 붙음
 * ================================================================= */


/** 이 할인이 이 과목에 해당하는가 */
function hitsClass(targets, c) {
  if (!targets || !targets.length) return true;      // 비우면 전 과목
  for (var i = 0; i < targets.length; i++) {
    var t = targets[i];
    if (t === c.key || t === c.name) return true;    // 전체키 또는 클래스명
  }
  return false;
}

/** 「출생연도:1991-2006」 → {from:1991, to:2006} */
function parseEligible(s) {
  s = (s == null ? '' : String(s)).trim();
  if (!s) return null;
  var m = s.match(/출생연도\s*:\s*(\d{4})\s*[-~]\s*(\d{4})/);
  if (!m) throw new Error('자격조건을 읽을 수 없습니다: "' + s + '"\n' +
    '「출생연도:1991-2006」 형태로 적어주세요.');
  return { from: +m[1], to: +m[2] };
}

/** 자격조건을 만족하는가 (생년월일 8자리) */
function meetsEligible(el, birth) {
  if (!el) return true;
  var d = String(birth == null ? '' : birth).replace(/[^0-9]/g, '');
  if (d.length !== 8) return false;                  // 생년월일이 없으면 자격 없음
  var y = +d.slice(0, 4);
  return y >= el.from && y <= el.to;
}

/**
 * @param cfg      설정
 * @param picks    선택한 과목 key 배열
 * @param manualIds 회원이 켠 할인 id 배열
 * @param birth    생년월일 8자리 (자격조건 판정용, 없으면 '')
 */
function calcQuote(cfg, picks, manualIds, birth, perClass) {
  var byKey = {};
  cfg.classes.forEach(function (c) { byKey[c.key] = c; });

  /* --- 과목 확인 --- */
  var clean = [];
  (picks || []).forEach(function (k) {
    k = (k == null ? '' : String(k)).trim();
    if (!k || clean.indexOf(k) >= 0) return;
    clean.push(k);
  });
  if (!clean.length) return { ok: false, error: '수업을 한 개 이상 선택해주세요.' };
  if (clean.length > (cfg.maxSubjects || 3))
    return { ok: false, error: '수업은 최대 ' + (cfg.maxSubjects || 3) + '개까지 신청할 수 있습니다.' };

  var items = [];
  for (var i = 0; i < clean.length; i++) {
    var c = byKey[clean[i]];
    if (!c) return { ok: false, error: '없는 수업입니다: ' + clean[i] };
    items.push(c);
  }
  for (var a = 0; a < items.length; a++) for (var b = a + 1; b < items.length; b++) {
    if (overlaps(items[a], items[b]))
      return { ok: false, error: '수업 시간이 겹칩니다: ' + items[a].name + ' ↔ ' + items[b].name };
  }

  var subtotal = 0;
  items.forEach(function (c) { subtotal += c.fee; });

  var manual = {};
  (manualIds || []).forEach(function (id) { manual[String(id).trim()] = true; });

  var preOpen = cfg.preDeadline ? (now() <= new Date(cfg.preDeadline)) : false;
  var begs = items.filter(function (c) { return c.beginner; });
  var gset = {}; begs.forEach(function (c) { gset[c.genre] = true; });
  var bothGenreBeginner = Object.keys(gset).length >= 2;

  /* --- 패키지 : 성립하는 것 중 하나 --- */
  var chosen = {}; items.forEach(function (c) { chosen[c.key] = true; });
  var bestPkg = null;
  (cfg.packages || []).forEach(function (p) {
    if (!p.need.every(function (k) { return chosen[k]; })) return;
    if (!bestPkg || p.discount > bestPkg.discount ||
        (p.discount === bestPkg.discount && p.order < bestPkg.order)) bestPkg = p;
  });

  /* --- 1단계 할인 후보 --- */
  /* 각 후보는 과목별 배분액(per)을 갖는다. 2단계에서 과목별 잔액을 알아야 하기 때문. */
  var pc = perClass || {};
  var locked = {};
  (cfg.discounts || []).forEach(function (d) {
    if (d.mode !== '과목선택정률') return;
    (pc[d.id] || []).forEach(function (k) { locked[k] = true; });
  });
  var usedFree = {};

  var cand = [];
  function push(id, label, per, extra) {
    var amount = 0;
    for (var k in per) amount += per[k];
    if (amount <= 0) return;
    var o = { id: id, label: label, per: per, amount: amount };
    if (extra) for (var x in extra) o[x] = extra[x];
    cand.push(o);
  }
  /** 금액을 과목들에 가격 비례로 나눈다 (마지막 과목이 나머지를 흡수) */
  function spread(amount, list) {
    var per = {}, total = 0, i;
    list.forEach(function (c) { total += c.fee; });
    if (total <= 0) return per;
    var used = 0;
    for (i = 0; i < list.length; i++) {
      var v = (i === list.length - 1) ? (amount - used)
                                      : Math.round(amount * list[i].fee / total);
      per[list[i].key] = v; used += v;
    }
    return per;
  }

  if (bestPkg && bestPkg.discount > 0) {
    var pkgItems = items.filter(function (c) { return bestPkg.need.indexOf(c.key) >= 0; });
    push('패키지', bestPkg.label, spread(bestPkg.discount, pkgItems), { pkgKeys: bestPkg.need });
  }

  var stage2 = [];   // 잔액정률은 따로 모은다
  (cfg.discounts || []).forEach(function (d) {
    var picked = (d.mode === '과목선택정률') ? (pc[d.id] || []) : null;
    var on = d.auto || manual[d.id] || (picked && picked.length > 0);
    if (!on) return;
    if (!meetsEligible(d.eligible, birth)) return;

    var mine = items.filter(function (c) { return hitsClass(d.targets, c); });
    if (!mine.length) return;

    if (d.mode === '잔액정률' || d.mode === '잔액정률_전체') {
      // 잔액정률      : 대상 과목의 남은 금액에만
      // 잔액정률_전체 : 대상 과목을 하나라도 신청했으면 전체 남은 금액에
      stage2.push({ def: d, items: (d.mode === '잔액정률_전체') ? items : mine });
      return;
    }

    var per = {}, cheapest;

    if (d.mode === '과목당사전할인') {
      if (!preOpen) return;
      mine.forEach(function (c) { if (c.preDiscount > 0) per[c.key] = c.preDiscount; });

    } else if (d.mode === '과목당정액') {
      mine.forEach(function (c) { per[c.key] = Math.min(d.value, c.fee); });

    } else if (d.mode === '인당정액') {
      per = spread(d.value, mine);

    } else if (d.mode === '과목당정률') {
      mine.forEach(function (c) { per[c.key] = Math.round(c.fee * d.value / 100); });

    } else if (d.mode === '과목선택정률') {
      mine.forEach(function (c) {
        if (picked.indexOf(c.key) >= 0) per[c.key] = Math.round(c.fee * d.value / 100);
      });

    } else if (d.mode === '무료과목_양장르비기너' || d.mode === '무료과목_비기너1') {
      if (d.mode === '무료과목_양장르비기너' && !bothGenreBeginner) return;
      cheapest = mine.filter(function (c) {
        return c.beginner && !usedFree[c.key] && !locked[c.key];
      }).slice().sort(function (x, y) { return x.fee - y.fee; })[0];
      if (!cheapest) return;
      per[cheapest.key] = cheapest.fee;
      usedFree[cheapest.key] = true;
    }

    push(d.id, d.label, per, { def: d, freeKey: (cheapest ? cheapest.key : null) });
  });

  /* --- 중복불가 해소 --- */
  var byId = {}; cand.forEach(function (x) { byId[x.id] = x; });
  var dead = {};

  // (가) 전체 배제 — 금액이 큰 쪽만 남긴다 (같으면 ID 순으로 고정)
  cand.forEach(function (x) {
    if (!x.def || !x.def.exclusive) return;
    x.def.exclusive.forEach(function (ex) {
      if (ex.scope === '과목') return;
      var other = byId[ex.id];
      if (!other) return;
      var loser;
      if (other.amount > x.amount) loser = x.id;
      else if (other.amount < x.amount) loser = other.id;
      else loser = (x.id < other.id) ? other.id : x.id;
      dead[loser] = true;
    });
  });

  // (나) 과목 단위 배제 — 상대가 붙은 과목에서만 뺀다
  cand.forEach(function (x) {
    if (dead[x.id] || !x.def || !x.def.exclusive) return;
    x.def.exclusive.forEach(function (ex) {
      if (ex.scope !== '과목') return;
      var other = byId[ex.id];
      if (!other || dead[ex.id]) return;
      for (var k in other.per) if (other.per[k] > 0) delete x.per[k];
    });
    x.amount = 0; for (var k2 in x.per) x.amount += x.per[k2];
    if (x.amount <= 0) dead[x.id] = true;
  });

  // (다) 무료가 된 과목에는 다른 할인을 붙이지 않는다
  var freeKeys = {};
  cand.forEach(function (x) { if (!dead[x.id] && x.freeKey) freeKeys[x.freeKey] = x.id; });
  cand.forEach(function (x) {
    if (dead[x.id]) return;
    for (var k in freeKeys) {
      if (freeKeys[k] !== x.id && x.per[k]) delete x.per[k];
    }
    x.amount = 0; for (var k2 in x.per) x.amount += x.per[k2];
    if (x.amount <= 0) dead[x.id] = true;
  });

  var lines = [];
  cand.forEach(function (x) {
    if (dead[x.id] || x.amount <= 0) return;
    lines.push({ id: x.id, label: x.label, amount: x.amount, per: x.per, stage: 1 });
  });

  /* --- 과목별 잔액 --- */
  var rest = {};
  items.forEach(function (c) { rest[c.key] = c.fee; });
  lines.forEach(function (l) { for (var k in l.per) rest[k] -= l.per[k]; });
  items.forEach(function (c) { if (rest[c.key] < 0) rest[c.key] = 0; });

  /* --- 2단계 : 잔액정률 --- */
  stage2.forEach(function (s) {
    var skip2 = {};
    (s.def.exclusive || []).forEach(function (ex) {
      if (ex.scope !== '과목') return;
      var other = byId[ex.id];
      if (!other || dead[ex.id]) return;
      for (var k in other.per) if (other.per[k] > 0) skip2[k] = true;
    });
    var per = {}, amount = 0;
    s.items.forEach(function (c) {
      if (skip2[c.key]) return;
      var v = Math.round(rest[c.key] * s.def.value / 100);
      if (v > 0) { per[c.key] = v; amount += v; }
    });
    if (amount > 0) lines.push({ id: s.def.id, label: s.def.label, amount: amount, per: per, stage: 2 });
  });

  var discountTotal = 0;
  lines.forEach(function (l) { discountTotal += l.amount; });

  return {
    ok: true,
    items: items.map(function (c) {
      return { key: c.key, genre: c.genre, name: c.name,
        display: c.display || (c.genre + ' ' + c.name), fee: c.fee, timeLabel: c.timeLabel };
    }),
    subtotal: subtotal,
    lines: lines.map(function (l) { return { id: l.id, label: l.label, amount: l.amount }; }),
    discountTotal: discountTotal,
    total: Math.max(0, subtotal - discountTotal),
    appliedIds: lines.map(function (l) { return l.id; })
  };
}
function period(){var t=now();
  if(t<new Date(CFG.openAt))return 'before';
  if(t>new Date(CFG.closeAt))return 'closed';return 'open';}
function canEdit(){return now()<=new Date(CFG.editUntil);}
function needBirth(){return CFG.authMode!=='휴대폰만';}
function slots(){var m={},o=[];
  CFG.classes.forEach(function(c){var k=(c.day||'')+' '+c.start;
    if(!m[k]){m[k]={label:c.timeLabel,start:c.start,list:[]};o.push(k);}m[k].list.push(c);});
  return o.map(function(k){return m[k];}).sort(function(a,b){return (a.start||0)-(b.start||0);});}
/* 「클래스」 시트에서 주간 시간표를 자동으로 만든다 */
function shortName(c){
  var n=dsp(c);
  if(n.indexOf(c.genre+' ')===0)n=n.slice(c.genre.length+1);
  return n.split('/')[0];
}
/* 「클래스」 시트에서 시간표를 만든다. 세로=시간, 가로=연습실(없으면 장르) */
function timetable(){
  var cols=[],slots={},order=[],days={};
  var useRoom=CFG.classes.some(function(c){return !!c.room;});
  CFG.classes.forEach(function(c){
    var col=useRoom?(c.room||'기타'):c.genre;
    if(cols.indexOf(col)<0)cols.push(col);
    days[c.day||'']=1;
    var k=(c.day||'')+'|'+c.start;
    if(!slots[k]){slots[k]={start:c.start,label:c.timeLabel,by:{}};order.push(k);}
    (slots[k].by[col]=slots[k].by[col]||[]).push(c);
  });
  var dayList=Object.keys(days).filter(Boolean);
  var oneDay=(dayList.length===1)?dayList[0]:'';
  order.sort(function(a,b){return (slots[a].start||0)-(slots[b].start||0);});

  var h='<div class="ttbox">';
  if(oneDay)h+='<div class="ttcap">매주 '+esc(oneDay)+'요일</div>';
  h+='<div class="ttscroll"><table class="tt"><thead><tr><th>시간</th>';
  cols.forEach(function(g){h+='<th>'+esc(g)+'</th>';});
  h+='</tr></thead><tbody>';
  order.forEach(function(k){
    var s=slots[k],lab=s.label;
    if(oneDay&&lab.indexOf(oneDay+' ')===0)lab=lab.slice(oneDay.length+1);
    h+='<tr><th class="tm">'+esc(lab)+'</th>';
    cols.forEach(function(g){
      var list=s.by[g]||[];
      h+='<td>'+(list.length
        ? list.map(function(c){
            return '<span class="cell">'+esc(useRoom?dsp(c):shortName(c))+'</span>'+
                   (c.teacher?'<span class="who">'+esc(c.teacher)+'</span>':'');
          }).join('')
        : '<span class="none">–</span>')+'</td>';
    });
    h+='</tr>';
  });
  return h+'</tbody></table></div></div>';
}
/* 신청 화면에 보일 순서 — 「설정」의 수업정렬순서·장르순서를 따른다 */
function sortedClasses(){
  return CFG.classes.slice().sort(function(a,b){
    var d=(a.order==null?9999:a.order)-(b.order==null?9999:b.order);
    return d!==0?d:((a.start||0)-(b.start||0));
  });
}
/* 시간·연습실·강사를 한 줄로 */
function metaOf(c){
  return [c.timeLabel, c.room, c.teacher].filter(Boolean).join(' · ');
}
function seatOf(k){return (CFG.seats&&CFG.seats[k])||null;}
function dsp(c){return (c&&c.display)?c.display:((c?c.genre:'')+' '+(c?c.name:'')).trim();}
function bq(){return calcQuote(CFG,S.picks,manualOn(),digits(S.editing?S.lookBirth:S.birth),S.perClass);}

function classPicker(edit){
  var h='';
  sortedClasses().forEach(function(c){
    var on=S.picks.indexOf(c.key)>=0, seat=seatOf(c.key);
    var mine=edit&&S.found&&S.found.picks.indexOf(c.key)>=0;
    var full=!!(seat&&seat.full)&&!on&&!mine;
    var clash=!on&&S.picks.some(function(k){
      return overlaps(c,CFG.classes.filter(function(x){return x.key===k;})[0]);});

    '함께 신청하는 분 닉네임 — 해당되는 것을 적어주세요.</p>';
  return h;

/* ===================== 이벤트 ===================== */
function bind(){
  var a=$('tabA'),b=$('tabB');
  if(a)a.onclick=function(){S.tab='apply';S.error='';render();};
  if(b)b.onclick=function(){S.tab='look';S.lookErr='';render();};
  document.querySelectorAll('input[data-key]').forEach(function(el){
    el.onchange=function(){var k=el.dataset.key,i=S.picks.indexOf(k);
      if(el.checked&&i<0)S.picks.push(k); if(!el.checked&&i>=0)S.picks.splice(i,1);
      syncPerClass(); S.error='';render();};});
  document.querySelectorAll('input[data-disc]').forEach(function(el){
    el.onchange=function(){S.manual[el.dataset.disc]=el.checked;S.error='';render();};});
  document.querySelectorAll('input[data-pc]').forEach(function(el){
    el.onchange=function(){
      var id=el.dataset.pc,k=el.dataset.pck;
      var arr=S.perClass[id]||[];var i=arr.indexOf(k);
      if(el.checked&&i<0)arr.push(k); if(!el.checked&&i>=0)arr.splice(i,1);
      if(arr.length)S.perClass[id]=arr; else delete S.perClass[id];
      S.error='';render();};});
  keep('fNick','nickname'); keep('fProof','proof');
  var nm=$('fName'); if(nm)nm.oninput=function(){S.realname=nm.value;
    if(!S.payerTouched){S.payer=nm.value;var p=$('fPayer');if(p)p.value=nm.value;}};
  var py=$('fPayer'); if(py)py.oninput=function(){S.payer=py.value;S.payerTouched=true;};
  fmt('fPhone','phone',hyphenPhone); fmt('fBirth','birth',hyphenBirth);
  fmt('lPhone','lookPhone',hyphenPhone); fmt('lBirth','lookBirth',hyphenBirth);
  document.querySelectorAll('input[name=gender]').forEach(function(el){
    el.onchange=function(){S.gender=el.value;};});
  var ag=$('fAgree'); if(ag)ag.onchange=function(){S.agreed=ag.checked;
    ag.closest('.agree').classList.toggle('on',ag.checked);};
  on('btnApply',doApply); on('btnLook',doLookup); on('btnSaveEdit',doUpdate); on('btnCancel',doCancel);
  on('btnEdit',function(){S.editing=true;S.picks=S.found.picks.slice();S.manual={};
    S.perClass=JSON.parse(JSON.stringify(S.found.perClass||{}));
    S.found.discounts.forEach(function(id){S.manual[id]=true;});
    S.proof=S.found.proof||'';S.lookErr='';render();});
  on('btnCancelEdit',function(){S.editing=false;S.lookErr='';render();});
  on('btnBack',function(){S.found=null;S.lookErr='';render();});
}
function bindDone(){
  on('btnCopy',function(){cp(S.done.orderNo,'신청번호를 복사했습니다');});
  on('btnCopyAcc',function(){cp(S.done.pay&&S.done.pay.account,'계좌번호를 복사했습니다');});
  on('btnHome',function(){resetAll();});
}
function cp(t,msg){if(!t)return;
  if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){toast(msg);},function(){toast(t);});
  else toast(t);}
function on(id,fn){var el=$(id);if(el)el.onclick=fn;}
function keep(id,key){var el=$(id);if(el)el.oninput=function(){S[key]=el.value;};}
function fmt(id,key,f){var el=$(id);if(!el)return;
  el.oninput=function(){var p=el.selectionStart,before=el.value;
    el.value=f(el.value);S[key]=el.value;
    if(p===before.length)el.setSelectionRange(el.value.length,el.value.length);};}
function resetAll(){S.done=null;S.found=null;S.editing=false;S.tab='apply';
  S.picks=[];S.manual={};S.perClass={};S.proof='';S.agreed=false;S.error='';S.fieldErr={};
  S.nickname='';S.realname='';S.phone='';S.birth='';S.gender='';S.payer='';
  S.lookErr='';S.lookBirth='';S.payerTouched=false;
  loadConfig().then(function(d){if(d&&d.ok){CFG=d.config;head();render();}}).catch(function(){render();});}

function checkFields(){
  var e={},q=bq();
  if(!str(S.nickname))e.fNick='닉네임을 입력해주세요.';
  if(!str(S.realname))e.fName='이름을 입력해주세요.';
  if(!/^01[0-9]{8,9}$/.test(digits(S.phone)))e.fPhone='휴대폰번호를 정확히 입력해주세요.';
  if(!validBirth(S.birth))e.fBirth='생년월일을 8자리로 정확히 입력해주세요. (예: 19900101)';
  if(!str(S.payer))e.fPayer='입금자명을 입력해주세요.';
  S.fieldErr=e;
  if(!q.ok)return q.error;
  if(Object.keys(e).length)return '빨간색으로 표시된 칸을 확인해주세요.';
  if(CFG.collectGender&&!S.gender)return '성별을 선택해주세요.';
  if(!S.agreed)return '개인정보 수집·이용에 동의해주세요.';
  var np=CFG.discounts.some(function(d){return d.needProof&&q.appliedIds.indexOf(d.id)>=0;});
  if(np&&!str(S.proof))return '선택하신 할인은 확인이 필요합니다. 「확인할 내용」을 채워주세요.';
  return null;
}
function doApply(){
  if(S.busy)return;
  var bad=checkFields();
  if(bad){S.error=bad;render();
    var first=document.querySelector('input.bad');if(first)first.scrollIntoView({block:'center'});return;}
  var q=bq();
  var reqId='r'+Date.now()+'_'+Math.random().toString(36).slice(2,10);
  S.busy=true;S.error='';render();
  post({action:'apply',reqId:reqId,nickname:str(S.nickname),realname:str(S.realname),
    phone:digits(S.phone),birth:digits(S.birth),gender:S.gender,payer:str(S.payer),agreed:true,
    picks:S.picks,discounts:manualOn(),perClass:S.perClass,proof:str(S.proof),clientTotal:q.total})
  .then(function(res){S.busy=false;
    if(res&&res.ok)finish(res);
    else{S.error=(res&&res.error)||'신청하지 못했습니다. 다시 시도해주세요.';render();}})
  .catch(function(){receipt(reqId).then(function(r){S.busy=false;
    if(r&&r.found)finish({ok:true,orderNo:r.orderNo,quote:q,
      pay:{bank:CFG.bank,account:CFG.account,holder:CFG.holder,note:CFG.payNote}});
    else{S.error='신청 결과를 확인하지 못했습니다. 「내 신청 확인」에서 조회해보시고, 없으면 다시 신청해주세요.';
      render();}});});
}
function finish(res){
  S.done={orderNo:res.orderNo,quote:res.quote||{items:[],total:0,discountTotal:0},
    pay:res.pay||{bank:CFG.bank,account:CFG.account,holder:CFG.holder,note:CFG.payNote}};
  try{localStorage.setItem('ls_phone',hyphenPhone(S.phone));}catch(e){}
  window.scrollTo(0,0);render();
}
function doLookup(){
  if(S.busy)return;
  if(!/^01[0-9]{8,9}$/.test(digits(S.lookPhone))){S.lookErr='휴대폰번호를 정확히 입력해주세요.';render();return;}
  if(needBirth()&&!validBirth(S.lookBirth)){S.lookErr='생년월일을 8자리로 입력해주세요.';render();return;}
  S.busy=true;S.lookErr='';render();
  post({action:'lookup',phone:digits(S.lookPhone),birth:digits(S.lookBirth)})
  .then(function(res){S.busy=false;
    if(res&&res.ok){S.found=res.order;S.lookErr='';}
    else S.lookErr=(res&&res.error)||'조회하지 못했습니다.';render();})
  .catch(function(){S.busy=false;S.lookErr='연결에 실패했습니다. 잠시 후 다시 시도해주세요.';render();});
}
function doUpdate(){
  if(S.busy)return;
  var q=bq();
  if(!q.ok){S.lookErr=q.error;render();return;}
  S.busy=true;S.lookErr='';render();
  post({action:'update',phone:digits(S.lookPhone),birth:digits(S.lookBirth),
    picks:S.picks,discounts:manualOn(),perClass:S.perClass,proof:str(S.proof)})
  .then(function(res){S.busy=false;
    if(res&&res.ok){toast('수정되었습니다');S.editing=false;S.found=null;S.lookErr='';
      render();doLookup();}
    else{S.lookErr=(res&&res.error)||'수정하지 못했습니다.';render();}})
  .catch(function(){S.busy=false;S.lookErr='연결에 실패했습니다.';render();});
}
function doCancel(){
  if(S.busy)return;
  if(!confirm('신청을 취소하시겠습니까?\n취소하면 자리가 다른 분께 넘어갈 수 있습니다.'))return;
  S.busy=true;S.lookErr='';render();
  post({action:'cancel',phone:digits(S.lookPhone),birth:digits(S.lookBirth)})
  .then(function(res){S.busy=false;
    if(res&&res.ok){toast('취소되었습니다');S.found=null;render();}
    else{S.lookErr=(res&&res.error)||'취소하지 못했습니다.';render();}})
  .catch(function(){S.busy=false;S.lookErr='연결에 실패했습니다.';render();});
}

function boot(){
  mountLogo();
  $('app').innerHTML='<div class="center"><div class="spin"></div><p>수업 정보를 불러오는 중입니다…</p></div>';
  loadConfig().then(function(d){
    if(!d||!d.ok)throw new Error((d&&d.error)||'설정을 읽지 못했습니다');
    CFG=d.config;
    if(CFG.serverNow)SKEW=new Date(CFG.serverNow).getTime()-Date.now();
    try{S.lookPhone=localStorage.getItem('ls_phone')||'';}catch(e){}
    head();render();
  }).catch(function(e){
    $('hSub').textContent='불러오지 못했습니다';
    var bd=$('hBadge');bd.hidden=false;bd.textContent='연결 실패';bd.className='badge off';
    $('app').innerHTML='<div class="center"><h2>정보를 불러오지 못했습니다</h2><p>'+
      esc(e.message||'')+'</p><button class="btn" id="btnRetry" style="max-width:230px;margin:20px auto 0">다시 시도</button></div>';
    on('btnRetry',boot);
  });
}
boot();
</script>
</body>
</html>
