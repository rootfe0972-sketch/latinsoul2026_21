<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>라틴소울 수업 신청</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#120a14; --card:#1e1320; --card2:#271828; --line:#3a2740; --line2:#4d3355;
  --txt:#f3eef5; --sub:#b6acbd; --dim:#8b7f92;
  --accent:#ff7a5c; --accent2:#ffab6b;
  --btn:#c2331a; --btnHover:#a92b15;
  --ok:#5ce08f; --warn:#ffb95c; --bad:#ff8f8f;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Pretendard Variable",Pretendard,system-ui,-apple-system,sans-serif;}
html{-webkit-text-size-adjust:100%;}
body{background:var(--bg);color:var(--txt);line-height:1.55;font-size:16px;}
button{font:inherit;cursor:pointer;border:none;}
:focus-visible{outline:3px solid var(--accent2);outline-offset:2px;}

.header{background:linear-gradient(160deg,#2a0f2e 0%,#3a1230 45%,#1a0a1c 100%);
  padding:28px 16px 22px;text-align:center;border-bottom:1px solid var(--line);}
.header h1{font-size:24px;font-weight:800;letter-spacing:-.02em;}
.header p{color:var(--sub);font-size:14px;margin-top:6px;}
.chip{display:inline-block;margin-top:10px;font-size:12px;padding:4px 12px;border-radius:20px;
  background:rgba(92,224,143,.14);color:var(--ok);}
.chip.bad{background:rgba(255,143,143,.14);color:var(--bad);}

.wrap{max-width:600px;margin:0 auto;padding:20px 16px 100px;}
.tabs{display:flex;gap:8px;margin-bottom:20px;}
.tabs button{flex:1;padding:13px;border-radius:12px;background:var(--card);color:var(--sub);
  border:1px solid var(--line);font-size:15px;font-weight:700;}
.tabs button[aria-selected="true"]{background:var(--card2);color:var(--txt);border-color:var(--accent);}

h2.sec{font-size:15px;font-weight:800;margin:26px 0 10px;display:flex;align-items:center;gap:8px;}
h2.sec .n{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
  border-radius:50%;background:var(--btn);color:#fff;font-size:12px;font-weight:800;flex:0 0 auto;}
h2.sec:first-child{margin-top:0;}
.hint{font-size:13px;color:var(--sub);margin:-4px 0 10px;}

.slot{margin-bottom:14px;}
.slot .st{font-size:13px;font-weight:700;color:var(--accent2);margin-bottom:6px;}
.opt{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:14px;margin-bottom:8px;cursor:pointer;transition:.12s;}
.opt:hover{border-color:var(--line2);}
.opt input{margin-top:3px;width:20px;height:20px;accent-color:var(--btn);flex:0 0 auto;cursor:pointer;}
.opt .body{flex:1;min-width:0;}
.opt .nm{font-size:15px;font-weight:700;}
.opt .meta{font-size:13px;color:var(--sub);margin-top:2px;}
.opt .fee{font-size:15px;font-weight:800;white-space:nowrap;}
.opt.on{border-color:var(--accent);background:var(--card2);}
.opt.off{opacity:.45;cursor:not-allowed;}
.opt.off input{cursor:not-allowed;}
.opt .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;margin-left:6px;
  background:rgba(255,185,92,.16);color:var(--warn);}
.opt .tag.full{background:rgba(255,143,143,.16);color:var(--bad);}

label.f{display:block;font-size:14px;font-weight:700;margin:14px 0 6px;}
label.f .req{color:var(--accent);margin-left:3px;}
input[type=text],input[type=tel],input[type=password],textarea,select{
  width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--txt);font-size:16px;}
input::placeholder,textarea::placeholder{color:var(--dim);}
textarea{min-height:76px;resize:vertical;}
.sub{font-size:12.5px;color:var(--sub);margin-top:5px;}
.pinrow{display:flex;gap:8px;}
.pinrow input{flex:1;letter-spacing:.35em;}
.pinrow button{padding:0 16px;border-radius:10px;background:var(--card2);color:var(--sub);
  border:1px solid var(--line);font-size:13px;white-space:nowrap;}
.genders{display:flex;gap:8px;}
.genders label{flex:1;text-align:center;padding:12px;border-radius:10px;background:var(--card);
  border:1px solid var(--line);font-size:15px;font-weight:700;cursor:pointer;}
.genders input{position:absolute;opacity:0;width:0;height:0;}
.genders label:has(input:checked){border-color:var(--accent);background:var(--card2);}

.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px;}
.line{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--sub);margin:7px 0;}
.line b{color:var(--txt);font-weight:700;}
.line.disc b{color:var(--ok);}
.hr{height:1px;background:var(--line);margin:13px 0;}
.total{display:flex;justify-content:space-between;align-items:baseline;}
.total .l{font-size:16px;font-weight:800;}
.total .v{font-size:27px;font-weight:800;color:var(--accent);}
.note{font-size:12.5px;color:var(--accent2);background:rgba(255,171,107,.1);
  border-radius:9px;padding:9px 11px;margin-top:9px;}
.err{font-size:13.5px;color:var(--bad);background:rgba(255,143,143,.1);
  border-radius:9px;padding:10px 12px;margin-top:10px;}

.agree{display:flex;gap:11px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:14px;margin-top:10px;cursor:pointer;}
.agree input{margin-top:2px;width:20px;height:20px;accent-color:var(--btn);flex:0 0 auto;}
details{margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
summary{cursor:pointer;font-size:13.5px;color:var(--sub);font-weight:700;}
details pre{margin-top:10px;font-size:12.5px;color:var(--sub);white-space:pre-wrap;line-height:1.6;
  font-family:inherit;}

.btn{display:block;width:100%;padding:16px;border-radius:12px;font-size:16px;font-weight:800;
  background:var(--btn);color:#fff;margin-top:18px;}
.btn:hover:not(:disabled){background:var(--btnHover);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn.ghost{background:var(--card2);color:var(--sub);border:1px solid var(--line);}
.btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(255,143,143,.4);}
.btnrow{display:flex;gap:10px;}
.btnrow .btn{margin-top:0;}

.center{text-align:center;padding:48px 20px;}
.center h2{font-size:20px;font-weight:800;margin-bottom:10px;}
.center p{color:var(--sub);font-size:14.5px;}
.spin{width:42px;height:42px;margin:0 auto 18px;border:4px solid var(--line);
  border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}

.done{text-align:center;padding:8px 0 0;}
.done .no{font-size:29px;font-weight:800;color:var(--accent);letter-spacing:.04em;margin:10px 0;
  font-variant-ligatures:none;}
.copy{padding:9px 18px;border-radius:9px;background:var(--card2);color:var(--txt);
  border:1px solid var(--line);font-size:13.5px;}
.pay{text-align:left;background:var(--card2);border:1px solid var(--line2);border-radius:12px;
  padding:15px;margin-top:16px;}
.pay .t{font-size:13px;color:var(--sub);font-weight:700;margin-bottom:7px;}
.pay .acc{font-size:18px;font-weight:800;}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#2b1c30;
  color:#fff;padding:13px 22px;border-radius:30px;font-size:14px;opacity:0;pointer-events:none;
  transition:.25s;z-index:50;border:1px solid var(--line2);max-width:88vw;text-align:center;}
.toast.show{opacity:1;transform:translate(-50%,0);}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
</style>
</head>
<body>

<div class="header">
  <h1 id="hTitle">라틴소울 수업 신청</h1>
  <p id="hSub">불러오는 중…</p>
  <span class="chip" id="hChip" hidden></span>
</div>

<div class="wrap" id="app" aria-live="polite">
  <div class="center"><div class="spin"></div><p>수업 정보를 불러오는 중입니다…</p></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =========================================================
 * 라틴소울 수업 신청 — 화면
 * 금액 계산은 서버(Code.gs)의 calcQuote 와 똑같은 코드를 씁니다.
 * 화면 계산은 '미리보기'일 뿐이고, 저장할 때 서버가 다시 계산합니다.
 * ========================================================= */
var API = "https://script.google.com/macros/s/AKfycbwzV2yVfWSePu8rFmvFERaPbVFBahPKybLgR1tCQyqkelLR_RcSvIPMG5w4btxIc7L2YQ/exec";

var CFG = null, SKEW = 0;
var S = {
  tab: 'apply',
  picks: [],            // 선택한 수업 key
  manual: {},           // 회원이 켠 할인 id
  proof: '',
  nickname: '', realname: '', phone: '', gender: '', payer: '', pin: '',
  agreed: false,
  busy: false,
  error: '',
  done: null,           // 신청 완료 결과
  found: null,          // 조회한 내 신청
  lookPhone: '', lookPin: '', lookErr: '',
  editing: false
};

/* ---------- 도구 ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function won(n){ return (n||0).toLocaleString('ko-KR') + '원'; }
function str(v){ return v == null ? '' : String(v).trim(); }
function digits(v){ return str(v).replace(/[^0-9]/g,''); }
function now(){ return new Date(Date.now() + SKEW); }
function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('show');},2600); }
function fmtDate(iso){
  var d = new Date(iso);
  return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 '+
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

/* ---------- 서버 통신 ---------- */
function loadConfig(){
  return new Promise(function(resolve, reject){
    var cb = 'ls_cb_' + Math.floor(Math.random()*1e9);
    var s = document.createElement('script');
    var t = setTimeout(function(){ try{delete window[cb];}catch(e){} s.remove();
      reject(new Error('시간이 초과되었습니다')); }, 20000);
    window[cb] = function(d){ clearTimeout(t); try{delete window[cb];}catch(e){} s.remove(); resolve(d); };
    s.onerror = function(){ clearTimeout(t); s.remove(); reject(new Error('연결하지 못했습니다')); };
    s.src = API + '?callback=' + cb + '&t=' + Date.now();
    document.body.appendChild(s);
  });
}
function receipt(reqId){
  return new Promise(function(resolve){
    var cb = 'ls_rc_' + Math.floor(Math.random()*1e9);
    var s = document.createElement('script');
    var t = setTimeout(function(){ try{delete window[cb];}catch(e){} s.remove(); resolve(null); }, 15000);
    window[cb] = function(d){ clearTimeout(t); try{delete window[cb];}catch(e){} s.remove(); resolve(d); };
    s.onerror = function(){ clearTimeout(t); s.remove(); resolve(null); };
    s.src = API + '?action=receipt&reqId=' + encodeURIComponent(reqId) + '&callback=' + cb + '&t=' + Date.now();
    document.body.appendChild(s);
  });
}
function post(payload){
  return fetch(API, {
    method:'POST', mode:'cors', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  }).then(function(r){ return r.json(); });
}

/* =========================================================
 * 금액 계산 — 서버 Code.gs 의 calcQuote 와 동일한 규칙
 * ========================================================= */
function overlaps(a,b){
  if(!a||!b) return false;
  if(a.day && b.day && a.day !== b.day) return false;
  if(a.start == null || b.start == null) return false;
  return a.start < b.end && b.start < a.end;
}
function calcQuote(cfg, picks, manualIds){
  var byKey = {};
  cfg.classes.forEach(function(c){ byKey[c.key]=c; });

  var clean=[];
  (picks||[]).forEach(function(k){ k=str(k); if(!k||clean.indexOf(k)>=0) return; clean.push(k); });
  if(!clean.length) return {ok:false, error:'수업을 한 개 이상 선택해주세요.'};
  if(clean.length > (cfg.maxSubjects||3))
    return {ok:false, error:'수업은 최대 '+(cfg.maxSubjects||3)+'개까지 신청할 수 있습니다.'};

  var items=[];
  for(var i=0;i<clean.length;i++){
    var c=byKey[clean[i]];
    if(!c) return {ok:false, error:'없는 수업입니다: '+clean[i]};
    items.push(c);
  }
  for(var a=0;a<items.length;a++) for(var b=a+1;b<items.length;b++){
    if(overlaps(items[a],items[b]))
      return {ok:false, error:'수업 시간이 겹칩니다: '+items[a].name+' ↔ '+items[b].name};
  }

  var subtotal = items.reduce(function(s,c){ return s+c.fee; },0);
  var manual={}; (manualIds||[]).forEach(function(id){ manual[str(id)]=true; });

  var preOpen = cfg.preDeadline ? (now() <= new Date(cfg.preDeadline)) : false;
  var beginners = items.filter(function(c){ return c.beginner; });
  var gset={}; beginners.forEach(function(c){ gset[c.genre]=true; });
  var bothGenreBeginner = Object.keys(gset).length >= 2;

  var chosen={}; items.forEach(function(c){ chosen[c.key]=true; });
  var bestPkg=null;
  cfg.packages.forEach(function(p){
    if(!p.need.every(function(k){ return chosen[k]; })) return;
    if(!bestPkg || p.discount>bestPkg.discount ||
       (p.discount===bestPkg.discount && p.order<bestPkg.order)) bestPkg=p;
  });

  var cand=[], preDef=null;
  if(bestPkg && bestPkg.discount>0)
    cand.push({id:'패키지', label:bestPkg.label, amount:bestPkg.discount, pkgKeys:bestPkg.need});

  cfg.discounts.forEach(function(d){
    if(d.mode==='과목당사전할인'){ if(preOpen && (d.auto||manual[d.id])) preDef=d; return; }
    if(!(d.auto||manual[d.id])) return;
    var amount=0, freeKey=null;
    if(d.mode==='과목당정액'){ amount = d.value*items.length; }
    else if(d.mode==='인당정액'){ amount = d.value; }
    else if(d.mode==='과목당정률'){
      amount = items.reduce(function(s,c){ return s+Math.round(c.fee*d.value/100); },0);
    }
    else if(d.mode==='무료과목_양장르비기너'){
      if(!bothGenreBeginner) return;
      var ch1 = beginners.slice().sort(function(x,y){ return x.fee-y.fee; })[0];
      if(!ch1) return; amount=ch1.fee; freeKey=ch1.key;
    }
    else if(d.mode==='무료과목_비기너1'){
      if(!beginners.length) return;
      var ch2 = beginners.slice().sort(function(x,y){ return x.fee-y.fee; })[0];
      amount=ch2.fee; freeKey=ch2.key;
    }
    if(amount>0) cand.push({id:d.id, label:d.label, amount:amount, freeKey:freeKey, def:d});
  });

  var byId={}; cand.forEach(function(c){ byId[c.id]=c; });
  var dead={};
  cand.forEach(function(c){
    if(!c.def||!c.def.exclusive) return;
    c.def.exclusive.forEach(function(ex){
      if(ex.scope==='과목') return;
      var other=byId[ex.id]; if(!other) return;
      var loser;
      if(other.amount > c.amount) loser=c.id;
      else if(other.amount < c.amount) loser=other.id;
      else loser = (c.id < other.id) ? other.id : c.id;
      dead[loser]=true;
    });
  });

  var lines = cand.filter(function(c){ return !dead[c.id] && c.amount>0; })
    .map(function(c){ return {id:c.id, label:c.label, amount:c.amount, freeKey:c.freeKey||null}; });

  if(preDef){
    var skip={};
    lines.forEach(function(l){ if(l.freeKey) skip[l.freeKey]=true; });
    preDef.exclusive.forEach(function(ex){
      if(ex.scope!=='과목') return;
      var other=byId[ex.id];
      if(!other||dead[ex.id]||!other.pkgKeys) return;
      other.pkgKeys.forEach(function(k){ skip[k]=true; });
    });
    var pre=0;
    items.forEach(function(c){ if(!skip[c.key]) pre += (c.preDiscount||0); });
    if(pre>0) lines.unshift({id:preDef.id, label:preDef.label, amount:pre, freeKey:null});
  }

  var discountTotal = lines.reduce(function(s,l){ return s+l.amount; },0);
  return {
    ok:true, items:items, subtotal:subtotal, lines:lines,
    discountTotal:discountTotal, total:Math.max(0, subtotal-discountTotal),
    appliedIds: lines.map(function(l){ return l.id; })
  };
}

/* ---------- 기간 판정 ---------- */
function period(){
  var t = now();
  if(t < new Date(CFG.openAt)) return 'before';
  if(t > new Date(CFG.closeAt)) return 'closed';
  return 'open';
}
function canEdit(){ return now() <= new Date(CFG.editUntil); }

/* ---------- 수업을 시간대별로 묶기 ---------- */
function slots(){
  var map = {}, order = [];
  CFG.classes.forEach(function(c){
    var k = (c.day||'') + ' ' + String(c.start);
    if(!map[k]){ map[k] = {label:c.timeLabel, start:c.start, day:c.day, list:[]}; order.push(k); }
    map[k].list.push(c);
  });
  return order.map(function(k){ return map[k]; })
    .sort(function(a,b){ return (a.start||0)-(b.start||0); });
}
function seatOf(key){ return (CFG.seats && CFG.seats[key]) || null; }

/* =========================================================
 * 화면 그리기
 * ========================================================= */
function render(){
  var app = $('app');
  if(S.done){ app.innerHTML = viewDone(); bindDone(); return; }

  var p = period();
  var html = '';
  html += '<div class="tabs" role="tablist">';
  html += '<button role="tab" id="tabA" aria-selected="'+(S.tab==='apply')+'"'+
          (p!=='open'?' disabled':'')+'>신청하기</button>';
  html += '<button role="tab" id="tabB" aria-selected="'+(S.tab==='look')+'">내 신청 확인</button>';
  html += '</div>';

  if(S.tab==='look')      html += viewLookup();
  else if(p==='before')   html += viewBefore();
  else if(p==='closed')   html += viewClosed();
  else                    html += viewApply();

  app.innerHTML = html;
  bind();
}

function viewBefore(){
  return '<div class="box"><h2 class="sec">신청은 아직 열리지 않았습니다</h2>'+
    '<p class="hint">신청 시작: <b>'+esc(fmtDate(CFG.openAt))+'</b><br>'+
    '신청 마감: '+esc(fmtDate(CFG.closeAt))+'</p></div>'+
    '<h2 class="sec"><span class="n">·</span>수업과 강습비</h2>'+ viewClassTable();
}
function viewClosed(){
  return '<div class="box"><h2 class="sec">신청이 마감되었습니다</h2>'+
    '<p class="hint">마감: '+esc(fmtDate(CFG.closeAt))+'<br>'+
    (canEdit() ? '이미 신청하신 분은 「내 신청 확인」에서 수정·취소하실 수 있습니다.'
               : '수정·취소 기간도 지났습니다. 운영진에게 문의해주세요.')+'</p></div>'+
    '<h2 class="sec"><span class="n">·</span>수업과 강습비</h2>'+ viewClassTable();
}
function viewClassTable(){
  var h = '';
  slots().forEach(function(sl){
    h += '<div class="slot"><div class="st">'+esc(sl.label)+'</div>';
    sl.list.forEach(function(c){
      h += '<div class="opt" style="cursor:default"><div class="body"><div class="nm">'+
        esc(c.genre+' '+c.name)+'</div></div><div class="fee">'+won(c.fee)+'</div></div>';
    });
    h += '</div>';
  });
  return h;
}

function viewApply(){
  var q = calcQuote(CFG, S.picks, Object.keys(S.manual).filter(function(k){return S.manual[k];}));
  var h = '';

  /* 1. 수업 */
  h += '<h2 class="sec"><span class="n">1</span>수업 선택</h2>';
  h += '<p class="hint">최대 '+(CFG.maxSubjects||3)+'개까지 · 시간이 겹치는 수업은 자동으로 잠깁니다.</p>';
  slots().forEach(function(sl){
    h += '<div class="slot"><div class="st">'+esc(sl.label)+'</div>';
    sl.list.forEach(function(c){
      var on = S.picks.indexOf(c.key)>=0;
      var seat = seatOf(c.key);
      var full = !!(seat && seat.full) && !on;
      var clash = !on && S.picks.some(function(k){
        var o = CFG.classes.filter(function(x){return x.key===k;})[0];
        return overlaps(c,o);
      });
      var over = !on && S.picks.length >= (CFG.maxSubjects||3);
      var off = full || clash || over;
      var why = full ? '<span class="tag full">마감</span>'
              : clash ? '<span class="tag">시간 겹침</span>'
              : over ? '<span class="tag">최대 개수</span>' : '';
      var left = (seat && seat.capacity!=null && !full)
        ? '<span class="tag">남은 자리 '+seat.left+'</span>' : '';
      h += '<label class="opt'+(on?' on':'')+(off?' off':'')+'">'+
        '<input type="checkbox" data-key="'+esc(c.key)+'"'+(on?' checked':'')+(off?' disabled':'')+'>'+
        '<span class="body"><span class="nm">'+esc(c.genre+' '+c.name)+why+left+'</span>'+
        '<span class="meta">'+esc(c.timeLabel)+'</span></span>'+
        '<span class="fee">'+won(c.fee)+'</span></label>';
    });
    h += '</div>';
  });

  /* 2. 할인 */
  var picked = Object.keys(S.manual).filter(function(k){return S.manual[k];});
  var manualList = CFG.discounts.filter(function(d){ return !d.auto; });
  if(manualList.length){
    h += '<h2 class="sec"><span class="n">2</span>해당되는 할인</h2>';
    h += '<p class="hint">해당하시는 것만 켜주세요. 운영진이 확인합니다.</p>';
    manualList.forEach(function(d){
      var on = !!S.manual[d.id];
      h += '<label class="opt'+(on?' on':'')+'">'+
        '<input type="checkbox" data-disc="'+esc(d.id)+'"'+(on?' checked':'')+'>'+
        '<span class="body"><span class="nm">'+esc(d.label)+
        (d.needProof?'<span class="tag">확인 필요</span>':'')+'</span>'+
        (d.note?'<span class="meta">'+esc(d.note)+'</span>':'')+'</span></label>';
    });
    var needProof = CFG.discounts.some(function(d){
      return d.needProof && picked.indexOf(d.id)>=0; });
    if(needProof){
      h += '<label class="f" for="fProof">확인할 내용<span class="req">*</span></label>'+
        '<textarea id="fProof" placeholder="예) 카페 가입인사 글 링크 / 함께 신청하는 분 닉네임">'+
        esc(S.proof)+'</textarea>'+
        '<p class="sub">운영진이 확인할 수 있게 적어주세요. 확인이 안 되면 할인이 취소될 수 있습니다.</p>';
    }
  }

  /* 3. 금액 */
  h += '<h2 class="sec"><span class="n">3</span>금액</h2>' + viewQuote(q);

  /* 4. 신청자 */
  h += '<h2 class="sec"><span class="n">4</span>신청자 정보</h2>';
  h += field('fNick','닉네임','text','동호회에서 쓰는 닉네임', S.nickname, true);
  h += field('fName','이름','text','입금자명 대조에 씁니다', S.realname, true);
  h += field('fPhone','휴대폰번호','tel','010-1234-5678', S.phone, true);
  if(CFG.collectGender){
    h += '<span class="f" id="lblGender">성별<span class="req">*</span></span><div class="genders" role="radiogroup" aria-labelledby="lblGender">';
    ['여성','남성'].forEach(function(g){
      h += '<label><input type="radio" name="gender" value="'+g+'"'+
        (S.gender===g?' checked':'')+'>'+g+'</label>';
    });
    h += '</div>';
  }
  h += field('fPayer','입금자명','text','통장에 찍히는 이름', S.payer, true);
  h += '<label class="f" for="fPin">확인번호 (숫자 4자리)<span class="req">*</span></label>'+
    '<div class="pinrow"><input type="password" id="fPin" inputmode="numeric" maxlength="4" '+
    'placeholder="••••" value="'+esc(S.pin)+'" autocomplete="off">'+
    '<button type="button" id="pinEye">보기</button></div>'+
    '<p class="sub">신청을 <b>수정·취소</b>할 때 쓰는 번호입니다. '+
    '운영진이 확인할 수 있으니, 다른 곳에서 쓰는 비밀번호와 <b>다르게</b> 정해주세요.</p>';

  /* 5. 동의 */
  h += '<h2 class="sec"><span class="n">5</span>개인정보 동의</h2>';
  h += '<label class="agree"><input type="checkbox" id="fAgree"'+(S.agreed?' checked':'')+'>'+
    '<span>개인정보 수집·이용에 동의합니다.<span class="req" style="color:var(--accent)">*</span></span></label>';
  if(CFG.privacyText){
    h += '<details><summary>수집 항목과 이용 목적 보기</summary><pre>'+esc(CFG.privacyText)+'</pre></details>';
  }

  if(S.error) h += '<div class="err">'+esc(S.error)+'</div>';
  h += '<button class="btn" id="btnApply"'+(S.busy?' disabled':'')+'>'+
    (S.busy?'신청하는 중…':'신청하기')+'</button>';
  return h;
}

function field(id,label,type,ph,val,req){

function viewQuote(q){

  q.items.forEach(function(c){
    h += '<div class="line"><span>'+esc(c.genre+' '+c.name)+'</span><b>'+won(c.fee)+'</b></div>';
  });
  h += '<div class="hr"></div>';
  h += '<div class="line"><span>수업 합계</span><b>'+won(q.subtotal)+'</b></div>';
  q.lines.forEach(function(l){
    h += '<div class="line disc"><span>'+esc(l.label)+'</span><b>-'+won(l.amount)+'</b></div>';

  h += '<div class="hr"></div>';
  h += '<div class="total"><span class="l">최종 금액</span><span class="v">'+won(q.total)+'</span></div>';

/* =========================================================
 * 이벤트
 * ========================================================= */
function bind(){
  var a=$('tabA'), b=$('tabB');
  if(a) a.onclick=function(){ S.tab='apply'; S.error=''; render(); };
  if(b) b.onclick=function(){ S.tab='look'; S.lookErr=''; render(); };

  document.querySelectorAll('input[data-key]').forEach(function(el){
    el.onchange=function(){
      var k=el.dataset.key, i=S.picks.indexOf(k);
      if(el.checked && i<0) S.picks.push(k);
      if(!el.checked && i>=0) S.picks.splice(i,1);
      S.error=''; render();
    };
  });
  document.querySelectorAll('input[data-disc]').forEach(function(el){
    el.onchange=function(){ S.manual[el.dataset.disc]=el.checked; S.error=''; render(); };
  });

  keep('fNick','nickname'); keep('fName','realname'); keep('fPhone','phone');
  keep('fPayer','payer'); keep('fPin','pin'); keep('fProof','proof');
  keep('lPhone','lookPhone'); keep('lPin','lookPin'); keep('ePin','lookPin');

  document.querySelectorAll('input[name=gender]').forEach(function(el){
    el.onchange=function(){ S.gender=el.value; };
  });
  var ag=$('fAgree'); if(ag) ag.onchange=function(){ S.agreed=ag.checked; };

  eye('pinEye','fPin'); eye('lPinEye','lPin');

  on('btnApply', doApply);
  on('btnLook', doLookup);
  on('btnEdit', function(){
    S.editing=true; S.picks=S.found.picks.slice(); S.manual={};
    S.found.discounts.forEach(function(id){ S.manual[id]=true; });
    S.proof=S.found.proof||''; S.lookErr=''; render();
  });
  on('btnCancelEdit', function(){ S.editing=false; S.lookErr=''; render(); });
  on('btnSaveEdit', doUpdate);
  on('btnCancel', doCancel);
  on('btnBack', function(){ S.found=null; S.lookPin=''; S.lookErr=''; render(); });
}
function bindDone(){
  on('btnCopy', function(){
    var t=S.done.orderNo;
    if(navigator.clipboard) navigator.clipboard.writeText(t).then(function(){ toast('신청번호를 복사했습니다'); },
      function(){ toast(t); });
    else toast(t);
  });
  on('btnHome', function(){ resetAll(); });
}
function on(id,fn){ var el=$(id); if(el) el.onclick=fn; }
function keep(id,key){
  var el=$(id); if(!el) return;
  el.oninput=function(){ S[key]=el.value; };
}
function eye(btnId,inpId){
  var b=$(btnId), i=$(inpId); if(!b||!i) return;
  b.onclick=function(){
    var show = i.type==='password';
    i.type = show ? 'text' : 'password';
    b.textContent = show ? '숨기기' : '보기';
  };
}
function resetAll(){
  S.done=null; S.found=null; S.editing=false; S.tab='apply';
  S.picks=[]; S.manual={}; S.proof=''; S.pin=''; S.agreed=false;
  S.error=''; S.lookErr=''; S.lookPin='';
  reloadSeats();
}

/* ---------- 동작 ---------- */
function localCheck(){
  var q = calcQuote(CFG, S.picks, Object.keys(S.manual).filter(function(k){return S.manual[k];}));
  if(!q.ok) return q.error;
  if(!str(S.nickname)) return '닉네임을 입력해주세요.';
  if(!str(S.realname)) return '이름을 입력해주세요.';
  if(!/^01[0-9]{8,9}$/.test(digits(S.phone))) return '휴대폰번호를 정확히 입력해주세요.';
  if(CFG.collectGender && !S.gender) return '성별을 선택해주세요.';
  if(!str(S.payer)) return '입금자명을 입력해주세요.';
  if(!/^[0-9]{4}$/.test(digits(S.pin))) return '확인번호를 숫자 4자리로 입력해주세요.';
  if(!S.agreed) return '개인정보 수집·이용에 동의해주세요.';
  var needProof = CFG.discounts.some(function(d){
    return d.needProof && q.appliedIds.indexOf(d.id)>=0; });
  if(needProof && !str(S.proof)) return '선택하신 할인은 확인이 필요합니다. 「확인할 내용」을 채워주세요.';
  return null;
}

function doApply(){
  if(S.busy) return;
  var bad = localCheck();
  if(bad){ S.error=bad; render(); return; }

  var q = calcQuote(CFG, S.picks, Object.keys(S.manual).filter(function(k){return S.manual[k];}));
  var reqId = 'r' + Date.now() + '_' + Math.random().toString(36).slice(2,10);
  S.busy=true; S.error=''; render();

  var payload = {
    action:'apply', reqId:reqId,
    nickname:str(S.nickname), realname:str(S.realname),
    phone:digits(S.phone), gender:S.gender, payer:str(S.payer),
    pin:digits(S.pin), agreed:true,
    picks:S.picks, discounts:Object.keys(S.manual).filter(function(k){return S.manual[k];}),
    proof:str(S.proof), clientTotal:q.total
  };

  post(payload).then(function(res){
    S.busy=false;
    if(res && res.ok){ finish(res); }
    else { S.error = (res && res.error) || '신청하지 못했습니다. 다시 시도해주세요.'; render(); }
  }).catch(function(){
    // 응답을 못 읽었을 때 — 저장이 됐는지 서버에 되묻는다
    receipt(reqId).then(function(r){
      S.busy=false;
      if(r && r.found){
        finish({ok:true, orderNo:r.orderNo, quote:q,
          pay:{bank:CFG.bank, account:CFG.account, holder:CFG.holder, note:CFG.payNote}});
      } else {
        S.error='신청 결과를 확인하지 못했습니다. 잠시 후 「내 신청 확인」에서 조회해보시고, '+
          '없으면 다시 신청해주세요.';
        render();
      }
    });
  });
}
function finish(res){
  S.done = {orderNo:res.orderNo, quote:res.quote||{items:[],total:0,discountTotal:0}, pay:res.pay};
  try{ localStorage.setItem('ls_phone', digits(S.phone)); }catch(e){}
  render();
}

function doLookup(){
  if(S.busy) return;
  if(!/^01[0-9]{8,9}$/.test(digits(S.lookPhone))){ S.lookErr='휴대폰번호를 정확히 입력해주세요.'; render(); return; }
  if(!/^[0-9]{4}$/.test(digits(S.lookPin))){ S.lookErr='확인번호를 숫자 4자리로 입력해주세요.'; render(); return; }
  S.busy=true; S.lookErr=''; render();
  post({action:'lookup', phone:digits(S.lookPhone), pin:digits(S.lookPin)})
    .then(function(res){
      S.busy=false;
      if(res && res.ok){ S.found=res.order; S.lookErr=''; }
      else S.lookErr=(res && res.error) || '조회하지 못했습니다.';
      render();
    })
    .catch(function(){ S.busy=false; S.lookErr='연결에 실패했습니다. 잠시 후 다시 시도해주세요.'; render(); });
}

function doUpdate(){
  if(S.busy) return;
  var q = calcQuote(CFG, S.picks, Object.keys(S.manual).filter(function(k){return S.manual[k];}));
  if(!q.ok){ S.lookErr=q.error; render(); return; }
  if(!/^[0-9]{4}$/.test(digits(S.lookPin))){ S.lookErr='확인번호를 입력해주세요.'; render(); return; }
  S.busy=true; S.lookErr=''; render();
  post({action:'update', phone:digits(S.lookPhone),
        pin:digits(S.lookPin), picks:S.picks,
        discounts:Object.keys(S.manual).filter(function(k){return S.manual[k];}),
        proof:str(S.proof)})
    .then(function(res){
      S.busy=false;
      if(res && res.ok){ toast('수정되었습니다'); S.editing=false; S.found=null;
        S.lookErr=''; reloadSeats(); doLookup(); }
      else { S.lookErr=(res&&res.error)||'수정하지 못했습니다.'; render(); }
    })
    .catch(function(){ S.busy=false; S.lookErr='연결에 실패했습니다.'; render(); });
}

function doCancel(){
  if(S.busy) return;
  if(!confirm('신청을 취소하시겠습니까?\n취소 후에는 자리가 다른 분께 넘어갈 수 있습니다.')) return;
  S.busy=true; S.lookErr=''; render();
  post({action:'cancel', phone:digits(S.lookPhone), pin:digits(S.lookPin)})
    .then(function(res){
      S.busy=false;
      if(res && res.ok){ toast('취소되었습니다'); S.found=null; S.lookPin=''; reloadSeats(); render(); }
      else { S.lookErr=(res&&res.error)||'취소하지 못했습니다.'; render(); }
    })
    .catch(function(){ S.busy=false; S.lookErr='연결에 실패했습니다.'; render(); });
}

function reloadSeats(){
  loadConfig().then(function(d){ if(d&&d.ok){ CFG=d.config; render(); } }).catch(function(){});
}

/* ---------- 시작 ---------- */
function head(){
  $('hTitle').textContent = CFG.title || '라틴소울 수업 신청';
  var p = period();
  $('hSub').textContent = p==='before' ? fmtDate(CFG.openAt)+' 신청 시작'
    : p==='closed' ? '신청 마감됨'
    : '신청 마감 ' + fmtDate(CFG.closeAt);
  var chip = $('hChip');
  chip.hidden = false;
  chip.textContent = p==='open' ? '신청 받는 중' : (p==='before' ? '오픈 전' : '마감');
  chip.className = 'chip' + (p==='open' ? '' : ' bad');
}

function boot(){
  $('app').innerHTML = '<div class="center"><div class="spin"></div><p>수업 정보를 불러오는 중입니다…</p></div>';
  loadConfig().then(function(d){
    if(!d || !d.ok) throw new Error((d && d.error) || '설정을 읽지 못했습니다');
    CFG = d.config;
    if(CFG.serverNow) SKEW = new Date(CFG.serverNow).getTime() - Date.now();
    try{ S.lookPhone = localStorage.getItem('ls_phone') || ''; }catch(e){}
    head();
    render();
  }).catch(function(e){
    $('hSub').textContent = '불러오지 못했습니다';
    var chip=$('hChip'); chip.hidden=false; chip.textContent='연결 실패'; chip.className='chip bad';
    $('app').innerHTML = '<div class="center"><h2>정보를 불러오지 못했습니다</h2>'+
      '<p>'+esc(e.message||'')+'</p>'+
      '<button class="btn" id="btnRetry" style="max-width:240px;margin:22px auto 0">다시 시도</button></div>';
    on('btnRetry', boot);
  });
}
boot();
</script>
</body>
</html>
